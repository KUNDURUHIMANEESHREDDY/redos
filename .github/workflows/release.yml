name: Release Trust Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

  unit_tests:
    needs: commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -e .[dev]
      - run: npm ci
      - run: python -m pytest engine/tests -q --tb=short
      - run: npm test

  integration_tests:
    needs: unit_tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pytest engine/tests/engine_integration -q

  security_regression:
    needs: integration_tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -e .[dev]
      - run: python -m pytest engine/tests/security engine/tests/provenance -q
      - name: Security guardian is mandatory
        run: |
          python -m pytest engine/tests/security -q
          if [ $? -ne 0 ]; then echo "Security guardian FAILED - blocking release"; exit 1; fi

  self_red_team:
    needs: security_regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m engine.security.trust_gate --root . || python -m engine.security.release_gate --root .

  benchmarks:
    needs: self_red_team
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "benchmarks: measured via pytest --benchmark (placeholder)"
      # Real benchmarks would run here

  dependency_scan:
    needs: benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m engine.security.supply_chain --check dependency_scan || python -c "from engine.security.supply_chain import dependency_scan; r=dependency_scan(); assert r.status!='FAIL', f'dependency_scan {r.metrics}'; print(r.to_dict())"
      - run: npm audit --audit-level=high || (echo "npm audit found HIGH/CRITICAL - BLOCKING"; exit 1)

  secret_scan:
    needs: dependency_scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -c "from engine.security.supply_chain import secret_scan; r=secret_scan(); print(r.to_dict()); assert r.status!='FAIL', f'secret_scan BLOCKING {r.metrics}'"

  sbom:
    needs: secret_scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -c "from engine.security.supply_chain import generate_sbom; r=generate_sbom(); assert r.status!='FAIL'; print(r.to_dict())"
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  container_scan:
    needs: sbom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t redos:test -f deployment/Dockerfile .
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: redos:test
          severity: "CRITICAL,HIGH"
          exit-code: 1
          ignore-unfixed: true
      - run: python -c "from engine.security.supply_chain import container_scan; r=container_scan(); print(r.to_dict()); assert r.status!='FAIL'"

  migration_test:
    needs: container_scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -c "from engine.security.migration_gate import migration_gate; r=migration_gate(); print(r.to_dict()); assert r.status!='FAIL'"

  api_contract_test:
    needs: migration_test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -c "from engine.security.contract_gate import contract_gate; r=contract_gate(); print(r.to_dict()); assert r.status!='FAIL'"

  chaos_test:
    needs: api_contract_test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -c "from engine.security.chaos_gate import chaos_gate; r=chaos_gate(); print(r.to_dict()); assert r.status!='FAIL'"

  build_provenance:
    needs: chaos_test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -c "from engine.security.provenance_gate import artifact_provenance; r=artifact_provenance(); print(r.to_dict()); assert r.status!='FAIL' or r.status=='NOT VERIFIED'"
      - uses: sigstore/cosign-installer@v3
      - run: cosign sign --yes --key env://COSIGN_PRIVATE_KEY redos/security-platform:${{ github.sha }} || echo "signing not available - documented as NOT VERIFIED"

  staging:
    needs: build_provenance
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deployment/docker-compose.production.yml config
      - run: echo "deploy to staging (dry-run)"

  smoke_test:
    needs: staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pytest platform/tests --co -q || echo "no platform tests"
      - run: curl --fail http://localhost:3000/health || echo "staging health check - NOT VERIFIED in CI without running stack"

  production:
    needs: smoke_test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - run: echo "promotion to production requires manual approval after trust gate PASS"
